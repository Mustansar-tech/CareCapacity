name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - 'shared/**'
      - 'vite.config.ts'
      - 'vercel.json'

# Vercel deploys automatically when it detects a push to main — this workflow
# is optional and only needed if you want to see deploy status in GitHub.
# It requires the Vercel CLI token + project/org IDs from your Vercel dashboard.

jobs:
  deploy:
    name: Trigger Vercel Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel (Production)
        run: vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
