            echo "Restarting PM2 ecosystem..."
            pm2 startOrRestart ecosystem.config.cjs --update-env

            echo "Saving PM2 state..."
            pm2 save

            echo "Checking backend health..."

            for i in {1..12}; do
              if curl -fsS http://localhost:5000/api/health; then
                echo "Local backend health check passed."
                break
              fi

              echo "Backend not ready yet. Retry $i/12..."
              sleep 5

              if [ "$i" -eq 12 ]; then
                echo "Backend health check failed after retries."
                pm2 status
                pm2 logs care-capacity-api --lines 80 --nostream
                exit 1
              fi
            done

            echo "Checking public API health..."

            for i in {1..6}; do
              if curl -fsS https://api.carecapacity.sur-group.co.uk/api/health; then
                echo "Public backend health check passed."
                break
              fi

              echo "Public API not ready yet. Retry $i/6..."
              sleep 5

              if [ "$i" -eq 6 ]; then
                echo "Public API health check failed after retries."
                systemctl status nginx --no-pager
                exit 1
              fi
            done

            echo "Deployment complete and health check passed."
