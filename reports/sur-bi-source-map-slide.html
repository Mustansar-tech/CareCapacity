<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SUR BI — connected data sources</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #dfe7e1;
      font-family: Inter, "Aptos", "Segoe UI", Arial, sans-serif;
      color: #17382f;
    }
    .slide {
      width: min(100vw, 177.7778vh);
      aspect-ratio: 16 / 9;
      background: #f5f7f4;
      overflow: hidden;
      box-shadow: 0 20px 70px rgba(21, 48, 37, .18);
    }
    svg { display: block; width: 100%; height: 100%; }
    @media print {
      @page { size: 13.333in 7.5in; margin: 0; }
      html, body { width: 13.333in; height: 7.5in; background: #f5f7f4; }
      .slide { width: 13.333in; height: 7.5in; box-shadow: none; }
    }
  </style>
</head>
<body>
<main class="slide" aria-label="SUR BI data-source overview slide">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="slide-title slide-desc">

      <stop offset="1" stop-color="#f5f7f4"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">

    <marker id="arrowFinance" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">

    </marker>
  </defs>

    <circle cx="800" cy="722" r="6" fill="#8170a8" stroke="#fff" stroke-width="3"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="554" y="383" width="492" height="254" rx="30" fill="url(#hub)"/>

  <g>

    <text x="584" y="484" fill="#fff" font-size="48" font-weight="760" letter-spacing="-1.5">SUR BI</text>

      <rect x="778" y="582" width="105" height="31" rx="15.5" fill="#ffffff" opacity=".12"/>
