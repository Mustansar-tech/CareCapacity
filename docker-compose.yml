services:
  api:
    # In production CI/CD, API_IMAGE is set to the ghcr.io image built by
    # GitHub Actions. Locally, omit API_IMAGE and it builds from the Dockerfile.
    image: ${API_IMAGE:-care-capacity-dashboard:local}
    build:
      context: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
