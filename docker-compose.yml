services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Allow the Vercel frontend to call this API
      CORS_ORIGIN: ${CORS_ORIGIN}
      # ORS / TravelTime routing APIs
      ORS_API_KEY: ${ORS_API_KEY}
      TRAVELTIME_APP_ID: ${TRAVELTIME_APP_ID}
      TRAVELTIME_API_KEY: ${TRAVELTIME_API_KEY}
      # People Planner automation (optional)
      ACCESS_EMAIL: ${ACCESS_EMAIL}
      ACCESS_PASSWORD: ${ACCESS_PASSWORD}
      PEOPLE_PLANNER_BRANCH_CONFIG: ${PEOPLE_PLANNER_BRANCH_CONFIG}
    restart: unless-stopped
